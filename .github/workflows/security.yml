name: Offline tests and publication checks
on:
  push:
  pull_request:
  schedule:
    - cron: '19 9 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check publication contents and history
        run: python tools/publication_guard.py
      - name: Install verified runtime dependencies
        run: |
          python -m pip --isolated install pip==26.2
          python -m pip --isolated install --require-hashes --only-binary=:all: -r shared/requirements.lock
      - name: Test without a broker connection
        run: python -X utf8 -B -m unittest discover -s tests -v
      - name: Audit the locked runtime environment
        run: |
          python -m pip freeze --exclude pip > runtime-audit.txt
          python -m venv .audit-venv
          .\.audit-venv\Scripts\python.exe -m pip --isolated install pip==26.2
          .\.audit-venv\Scripts\python.exe -m pip install pip-audit==2.10.0
          .\.audit-venv\Scripts\python.exe -m pip_audit --strict --disable-pip --no-deps -r runtime-audit.txt
